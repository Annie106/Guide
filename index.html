<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>误踢申诉方式</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: #f1f5f9;
            color: #111827;
            padding: 20px 16px 40px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* ===== 主卡片 ===== */
        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 28px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(226, 232, 240, 0.6);
            transition: all 0.2s;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.4px;
        }

        .header-left h1 span {
            color: #2563eb;
        }

        .sub-headline {
            font-size: 15px;
            color: #475569;
            margin-top: 4px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sub-headline .emoji {
            font-size: 18px;
        }

        /* ===== 步骤容器 ===== */
        .steps {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ===== 单个步骤 ===== */
        .step {
            background: #fafcff;
            border: 1px solid #e9edf4;
            border-radius: 18px;
            padding: 24px 26px;
            transition: all 0.25s ease;
            position: relative;
        }

        .step:first-child {
            border-top: 3px solid #2563eb;
        }

        .step:last-child {
            border-top: 3px solid #2563eb;
            background: #f8faff;
        }

        .step:hover {
            border-color: #b9d0f0;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.04);
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .step-num {
            width: 36px;
            height: 36px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 800;
            font-size: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        .step-title {
            font-size: 19px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.2px;
        }

        .step-desc {
            font-size: 15px;
            color: #334155;
            line-height: 1.7;
            margin-bottom: 18px;
            padding-left: 4px;
        }

        .step-desc strong {
            color: #2563eb;
            font-weight: 700;
        }

        /* ===== 图片占位区（网格） ===== */
        .image-placeholder {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 4px;
        }

        .placeholder-item {
            flex: 1 1 160px;
            min-width: 130px;
            background: #ffffff;
            border: 2px dashed #dce2ec;
            border-radius: 16px;
            padding: 16px 12px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #475569;
            font-size: 13px;
            transition: all 0.2s ease;
            cursor: default;
        }

        .placeholder-item:hover {
            border-color: #60a5fa;
            background: #f8faff;
            transform: translateY(-2px);
        }

        .placeholder-item .icon {
            font-size: 36px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .placeholder-item .label {
            font-weight: 600;
            color: #0f172a;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .placeholder-item .sub {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
        }

        /* ===== 图片样式（控制尺寸） ===== */
        .placeholder-item .demo-img {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: block;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 32px;
            padding-top: 18px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        /* ============================================================
                   移动端优化
        ============================================================ */

        @media (max-width: 640px) {
            .card {
                padding: 24px 18px 20px;
                border-radius: 24px;
            }
            .header-left h1 {
                font-size: 20px;
            }
            .step {
                padding: 20px 18px;
            }
            .step-title {
                font-size: 17px;
            }
            .step-desc {
                font-size: 14px;
            }
            .placeholder-item {
                flex: 1 1 calc(50% - 7px);
                min-width: 100px;
                padding: 18px 8px 14px;
            }
            .placeholder-item .icon {
                font-size: 30px;
            }
            .placeholder-item .label {
                font-size: 13px;
            }
            .placeholder-item .demo-img {
                max-width: 200px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 10px 30px;
            }
            .card {
                padding: 20px 14px 16px;
                border-radius: 20px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .header-left h1 {
                font-size: 19px;
            }
            .sub-headline {
                font-size: 14px;
                margin-bottom: 20px;
                padding-bottom: 14px;
            }
            .steps {
                gap: 18px;
            }
            .step {
                padding: 16px 14px;
                border-radius: 16px;
            }
            .step-header {
                gap: 10px;
                margin-bottom: 8px;
            }
            .step-num {
                width: 30px;
                height: 30px;
                font-size: 15px;
            }
            .step-title {
                font-size: 16px;
            }
            .step-desc {
                font-size: 14px;
                margin-bottom: 14px;
                padding-left: 0;
            }
            .image-placeholder {
                gap: 10px;
            }
            .placeholder-item {
                flex: 1 1 100%;
                min-width: 0;
                padding: 14px 12px;
                flex-direction: row;
                gap: 14px;
                justify-content: flex-start;
                border-radius: 14px;
                text-align: left;
            }
            .placeholder-item .icon {
                font-size: 28px;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            .placeholder-item .demo-img {
                max-width: 140px;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            .text-group {
                align-items: flex-start;
            }
            .placeholder-item .label {
                font-size: 14px;
            }
            .placeholder-item .sub {
                font-size: 12px;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                font-size: 12px;
                margin-top: 24px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 16px 10px 14px;
            }
            .header-left h1 {
                font-size: 17px;
            }
            .step {
                padding: 14px 12px;
            }
            .step-title {
                font-size: 15px;
            }
            .step-desc {
                font-size: 13px;
            }
            .placeholder-item {
                padding: 12px 10px;
                gap: 10px;
            }
            .placeholder-item .icon {
                font-size: 24px;
            }
            .placeholder-item .demo-img {
                max-width: 100px;
            }
            .placeholder-item .label {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="header-left">
                <h1>误踢申诉</h1>
            </div>
        </div>

        <div class="sub-headline">
            被误踢了？按以下步骤提交截图，管理员核实后会拉你回群。
        </div>

        <!-- ===== 步骤列表 ===== -->
        <div class="steps">

            <!-- 步骤 1：准备聊天记录截图 -->
            <div class="step">
                <div class="step-header">
                    <span class="step-num">1</span>
                    <span class="step-title">准备聊天记录截图</span>
                </div>
                <div class="step-desc">
                    打开被踢前的群聊，截取包含你 <strong>最近发言</strong> 及 <strong>上下文</strong> 的聊天记录，确保能看清你的昵称和发言时间。
                </div>
                <div class="image-placeholder">
                    <div class="placeholder-item">
                        <span class="icon">💬</span>
                        <div class="text-group">
                            <span class="label">聊天记录截图</span>
                            <span class="sub">被踢前上下文</span>
                        </div>
                    </div>
                    <div class="placeholder-item">
                        <span class="icon">🚫</span>
                        <div class="text-group">
                            <span class="label">被踢警告信息截图</span>
                            <span class="sub">警告信息截图</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 步骤 2：进入企业信息 -->
            <div class="step" style="border-top-color: #2563eb; background: #f8faff;">
                <div class="step-header">
                    <span class="step-num">2</span>
                    <span class="step-title">添加好友后，进入「企业信息」</span>
                </div>
                <div class="step-desc">
                    添加群主为好友 → 点击群主头像 → <strong>企业信息</strong> → 底部 <strong>「误踢反馈」</strong> 按钮，跳转问卷后提交截图。
                </div>
                <div class="image-placeholder">
                    <div class="placeholder-item" style="flex: 1 1 220px; min-width: 160px;">
                        <img 
                            src="https://links.8uid.com/d/860893d3b68a7587e186989811749330"
                            alt="企业信息页示意"
                            class="demo-img"
                        />
                        <div class="text-group">
                            <span class="label">企业信息页</span>
                            <span class="sub">示意入口位置</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== 底部 ===== -->
        <div class="footer">
            <span></span>
            <span></span>
        </div>

    </div>

</body>
</html>
