<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>误踢申诉指南</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: #f1f5f9;
            color: #111827;
            padding: 20px 16px 40px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* ===== 主卡片 ===== */
        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 28px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(226, 232, 240, 0.6);
            transition: all 0.2s;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.4px;
        }

        .sub-headline {
            font-size: 15px;
            color: #475569;
            margin-top: 4px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== 步骤容器 ===== */
        .steps {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ===== 单个步骤 ===== */
        .step {
            background: #fafcff;
            border: 1px solid #e9edf4;
            border-radius: 18px;
            padding: 24px 26px;
            transition: all 0.25s ease;
            position: relative;
        }

        .step:first-child {
            border-top: 3px solid #2563eb;
        }

        .step:last-child {
            border-top: 3px solid #2563eb;
            background: #f8faff;
        }

        .step:hover {
            border-color: #b9d0f0;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.04);
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .step-num {
            width: 36px;
            height: 36px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 800;
            font-size: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        .step-title {
            font-size: 19px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.2px;
        }

        .step-desc {
            font-size: 15px;
            color: #334155;
            line-height: 1.7;
            margin-bottom: 18px;
            padding-left: 4px;
        }

        .step-desc strong {
            color: #2563eb;
            font-weight: 700;
        }

        /* ===== 图片占位区（网格） ===== */
        .image-placeholder {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 4px;
        }

        .placeholder-item {
            flex: 1 1 160px;
            min-width: 130px;
            background: #ffffff;
            border: 2px dashed #dce2ec;
            border-radius: 16px;
            padding: 16px 12px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #475569;
            font-size: 13px;
            transition: all 0.2s ease;
            cursor: default;
            position: relative;
        }

        .placeholder-item:hover {
            border-color: #60a5fa;
            background: #f8faff;
            transform: translateY(-2px);
        }

        .placeholder-item .icon {
            font-size: 36px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .placeholder-item .label {
            font-weight: 600;
            color: #0f172a;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .placeholder-item .sub {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
        }

        /* ===== 图片样式 ===== */
        .placeholder-item .demo-img {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: block;
        }

        /* ===== 状态提示条（仅用于红色错误） ===== */
        .status-tip {
            width: 100%;
            max-width: 260px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 8px;
            display: none;
            transition: all 0.3s;
        }
        .status-tip.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
            display: block;
        }

        /* ===== 图片加载失败时的文字占位 ===== */
        .img-error-placeholder {
            display: none;
            width: 100%;
            max-width: 260px;
            min-height: 120px;
            background: #f1f5f9;
            border-radius: 10px;
            border: 2px dashed #cbd5e1;
            margin-bottom: 8px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 14px;
            padding: 20px;
            text-align: center;
        }
        .img-error-placeholder .err-icon {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 32px;
            padding-top: 18px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        /* ============================================================
                   右上角 Toast 提示（无关闭按钮，黄色进度条）
        ============================================================ */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: none;
            max-width: 90vw;
        }

        .toast-item {
            pointer-events: auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9edf4;
            min-width: 280px;
            max-width: 420px;
            animation: toastSlideIn 0.4s ease;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
            transform: translateX(0);
            overflow: hidden;
            cursor: pointer;
        }

        .toast-item.hiding {
            opacity: 0;
            transform: translateX(40px);
        }

        .toast-item .toast-content {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 24px 16px 22px;
        }

        .toast-item .toast-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .toast-item .toast-body {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .toast-item .toast-title {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
        }

        .toast-item .toast-desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
        }

        /* ===== Toast 黄色进度条 ===== */
        .toast-item .toast-progress {
            width: 100%;
            height: 4px;
            background: #fef3c7;
            border-radius: 0 0 14px 14px;
            overflow: hidden;
        }

        .toast-item .toast-progress .toast-progress-bar {
            height: 100%;
            background: #f59e0b;
            border-radius: 0 0 0 14px;
            width: 100%;
        }

        @keyframes progressShrink {
            from {
                width: 100%;
            }
            to {
                width: 0%;
            }
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* ============================================================
                   移动端优化（重点优化弹窗）
        ============================================================ */

        @media (max-width: 640px) {
            .card {
                padding: 24px 18px 20px;
                border-radius: 24px;
            }
            .header-left h1 {
                font-size: 20px;
            }
            .step {
                padding: 20px 18px;
            }
            .step-title {
                font-size: 17px;
            }
            .step-desc {
                font-size: 14px;
            }
            .placeholder-item {
                flex: 1 1 calc(50% - 7px);
                min-width: 100px;
                padding: 18px 8px 14px;
            }
            .placeholder-item .icon {
                font-size: 30px;
            }
            .placeholder-item .label {
                font-size: 13px;
            }
            .placeholder-item .demo-img {
                max-width: 200px;
            }
            .img-error-placeholder {
                max-width: 200px;
                min-height: 100px;
            }
            .status-tip {
                max-width: 200px;
                font-size: 12px;
                padding: 6px 10px;
            }

            /* 移动端弹窗优化：全宽，更紧凑 */
            .toast-container {
                top: 16px;
                right: 12px;
                left: 12px;
                align-items: stretch;
                max-width: 100%;
            }
            .toast-item {
                max-width: 100%;
                min-width: unset;
                border-radius: 12px;
                width: 100%;
            }
            .toast-item .toast-content {
                padding: 14px 18px 12px 16px;
                gap: 12px;
            }
            .toast-item .toast-title {
                font-size: 15px;
            }
            .toast-item .toast-desc {
                font-size: 13px;
            }
            .toast-item .toast-icon {
                font-size: 24px;
            }
            .toast-item .toast-progress {
                height: 3px;
                border-radius: 0 0 12px 12px;
            }
            .toast-item .toast-progress .toast-progress-bar {
                border-radius: 0 0 0 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 10px 30px;
            }
            .card {
                padding: 20px 14px 16px;
                border-radius: 20px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .header-left h1 {
                font-size: 19px;
            }
            .sub-headline {
                font-size: 14px;
                margin-bottom: 20px;
                padding-bottom: 14px;
            }
            .steps {
                gap: 18px;
            }
            .step {
                padding: 16px 14px;
                border-radius: 16px;
            }
            .step-header {
                gap: 10px;
                margin-bottom: 8px;
            }
            .step-num {
                width: 30px;
                height: 30px;
                font-size: 15px;
            }
            .step-title {
                font-size: 16px;
            }
            .step-desc {
                font-size: 14px;
                margin-bottom: 14px;
                padding-left: 0;
            }
            .image-placeholder {
                gap: 10px;
            }
            .placeholder-item {
                flex: 1 1 100%;
                min-width: 0;
                padding: 14px 12px;
                flex-direction: row;
                gap: 14px;
                justify-content: flex-start;
                border-radius: 14px;
                text-align: left;
                flex-wrap: wrap;
            }
            .placeholder-item .icon {
                font-size: 28px;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            .placeholder-item .demo-img {
                max-width: 140px;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            .img-error-placeholder {
                max-width: 140px;
                min-height: 80px;
                margin-bottom: 0;
                flex-shrink: 0;
                padding: 12px;
            }
            .img-error-placeholder .err-icon {
                font-size: 28px;
            }
            .status-tip {
                max-width: 100%;
                font-size: 12px;
                padding: 6px 10px;
                order: 10;
                flex-basis: 100%;
            }
            .text-group {
                align-items: flex-start;
            }
            .placeholder-item .label {
                font-size: 14px;
            }
            .placeholder-item .sub {
                font-size: 12px;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                font-size: 12px;
                margin-top: 24px;
            }

            /* 小屏手机弹窗优化 */
            .toast-container {
                top: 12px;
                right: 10px;
                left: 10px;
                gap: 6px;
            }
            .toast-item {
                border-radius: 10px;
            }
            .toast-item .toast-content {
                padding: 12px 14px 10px 12px;
                gap: 10px;
            }
            .toast-item .toast-title {
                font-size: 14px;
            }
            .toast-item .toast-desc {
                font-size: 12px;
            }
            .toast-item .toast-icon {
                font-size: 20px;
            }
            .toast-item .toast-progress {
                height: 2px;
                border-radius: 0 0 10px 10px;
            }
            .toast-item .toast-progress .toast-progress-bar {
                border-radius: 0 0 0 10px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 16px 10px 14px;
            }
            .header-left h1 {
                font-size: 17px;
            }
            .step {
                padding: 14px 12px;
            }
            .step-title {
                font-size: 15px;
            }
            .step-desc {
                font-size: 13px;
            }
            .placeholder-item {
                padding: 12px 10px;
                gap: 10px;
            }
            .placeholder-item .icon {
                font-size: 24px;
            }
            .placeholder-item .demo-img {
                max-width: 100px;
            }
            .img-error-placeholder {
                max-width: 100px;
                min-height: 60px;
                padding: 8px;
                font-size: 12px;
            }
            .img-error-placeholder .err-icon {
                font-size: 22px;
            }
            .placeholder-item .label {
                font-size: 13px;
            }
            .status-tip {
                font-size: 11px;
                padding: 4px 8px;
            }

            .toast-container {
                top: 8px;
                right: 8px;
                left: 8px;
            }
            .toast-item .toast-content {
                padding: 10px 12px 8px 10px;
                gap: 8px;
            }
            .toast-item .toast-title {
                font-size: 13px;
            }
            .toast-item .toast-desc {
                font-size: 11px;
            }
            .toast-item .toast-icon {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="header-left">
                <h1>误踢申诉</h1>
            </div>
        </div>

        <div class="sub-headline">
            被误踢了？按以下步骤提交截图，管理员核实后会拉你回群。
        </div>

        <!-- ===== 步骤列表 ===== -->
        <div class="steps">

            <!-- 步骤 1：准备聊天记录截图 -->
            <div class="step">
                <div class="step-header">
                    <span class="step-num">1</span>
                    <span class="step-title">准备聊天记录截图</span>
                </div>
                <div class="step-desc">
                    打开被踢前的群聊，截取包含你 <strong>最近发言</strong> 及 <strong>上下文</strong> 的聊天记录，确保能看清你的昵称和发言时间。
                </div>
                <div class="image-placeholder">
                    <div class="placeholder-item">
                        <span class="icon">💬</span>
                        <div class="text-group">
                            <span class="label">聊天记录截图</span>
                            <span class="sub">被踢前上下文</span>
                        </div>
                    </div>
                    <div class="placeholder-item">
                        <span class="icon">🚫</span>
                        <div class="text-group">
                            <span class="label">被踢警告信息截图</span>
                            <span class="sub">警告信息截图</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 步骤 2：添加群主 → 进入企业信息 -->
            <div class="step" style="border-top-color: #2563eb; background: #f8faff;">
                <div class="step-header">
                    <span class="step-num">2</span>
                    <span class="step-title">添加群主Annie → 进入「企业信息」</span>
                </div>
                <div class="step-desc">
                    <strong>添加群主为联系人后 → </strong>点击群主头像 → <strong>企业信息</strong> → 底部 <strong>「误踢反馈」</strong> 按钮，跳转问卷后提交截图。
                </div>
                <div class="image-placeholder">
                    <div class="placeholder-item" style="flex: 1 1 220px; min-width: 160px; flex-wrap: wrap;">

                        <!-- ===== 状态提示条（仅用于红色错误） ===== -->
                        <div id="statusTip" class="status-tip"></div>

                        <!-- ==========================================================
                        图片配置区 — 修改下方两个 src 即可
                        ========================================================== -->
                        <!-- 主图（建议使用外部图片链接，失效时会自动切换备用图并弹窗） -->
                        <img 
                            id="mainImage"
                            src="https://links.8uid.com/d/860893d3b68a7587e186989811749330"
                            alt="企业信息页示意"
                            class="demo-img"
                        />

                        <!-- 备用图（主图失效时自动切换至此，建议使用稳定链接） -->
                        <img 
                            id="fallbackImage"
                            src="https://153485619232768.abvod.cn/fly.png"
                            alt="备用示意图片"
                            class="demo-img"
                            style="display: none;"
                        />

                        <!-- ===== 纯文字备用（当主图和备用图都加载失败时显示） ===== -->
                        <div id="textFallback" class="img-error-placeholder" style="display: none;">
                            <span class="err-icon">🖼️</span>
                            <span>图片加载失败<br/>请参考文字描述</span>
                        </div>

                        <div class="text-group">
                            <span class="label">企业信息页</span>
                            <span class="sub">示意入口位置</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== 底部 ===== -->
        <div class="footer">
            <span></span>
            <span></span>
        </div>

    </div>

    <!-- ============================================================
    右上角 Toast 容器（无关闭按钮，黄色进度条）
    ============================================================ -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        // ================================================================
        //  Toast 管理（右上角弹窗，无关闭按钮，黄色进度条，点击关闭）
        // ================================================================

        var toastContainer = document.getElementById('toastContainer');
        var toastTimer = null;

        /**
         * 显示右上角 Toast 提示（带黄色进度条，无×按钮）
         * @param {string} icon - 图标 emoji
         * @param {string} title - 标题
         * @param {string} desc - 描述
         * @param {number} duration - 自动消失毫秒数，默认8000ms
         */
        function showToast(icon, title, desc, duration) {
            duration = duration || 8000;

            // 移除已有 toast
            var existing = toastContainer.querySelector('.toast-item');
            if (existing) {
                if (existing.parentNode) {
                    existing.parentNode.removeChild(existing);
                }
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
            }

            // 创建新 toast
            var toast = document.createElement('div');
            toast.className = 'toast-item';
            toast.innerHTML = 
                '<div class="toast-content">' +
                    '<span class="toast-icon">' + icon + '</span>' +
                    '<div class="toast-body">' +
                        '<span class="toast-title">' + title + '</span>' +
                        '<span class="toast-desc">' + desc + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="toast-progress">' +
                    '<div class="toast-progress-bar" id="toastProgressBar"></div>' +
                '</div>';

            // 点击 toast 任意区域关闭
            toast.addEventListener('click', function() {
                dismissToast(toast);
            });

            toastContainer.appendChild(toast);

            // 动态设置进度条动画时长
            var progressBar = toast.querySelector('#toastProgressBar');
            if (progressBar) {
                progressBar.style.animation = 'none';
                void progressBar.offsetHeight;
                progressBar.style.animation = 'progressShrink ' + (duration / 1000) + 's linear forwards';
            }

            // 自动消失
            if (duration > 0) {
                toastTimer = setTimeout(function() {
                    dismissToast(toast);
                }, duration);
            }
        }

        /**
         * 关闭单个 toast（带淡出动画）
         */
        function dismissToast(toast) {
            if (!toast || !toast.parentNode) return;
            if (toast.classList.contains('hiding')) return;

            toast.classList.add('hiding');
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }
            setTimeout(function() {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 300);
        }

        // ================================================================
        //  红色错误提示（仅用于备用图也失败时）
        // ================================================================

        function showErrorTip(message) {
            var tip = document.getElementById('statusTip');
            if (!tip) return;
            tip.textContent = message;
            tip.className = 'status-tip error';
        }

        function hideStatusTip() {
            var tip = document.getElementById('statusTip');
            if (!tip) return;
            tip.className = 'status-tip';
            tip.textContent = '';
        }

        // ================================================================
        //  文字占位（主图 + 备用图均失败）
        // ================================================================

        function showTextFallback() {
            var main = document.getElementById('mainImage');
            var fallback = document.getElementById('fallbackImage');
            var textFallback = document.getElementById('textFallback');

            if (main) main.style.display = 'none';
            if (fallback) fallback.style.display = 'none';
            if (textFallback) textFallback.style.display = 'flex';
        }

        // ================================================================
        //  备用图加载失败 → 红色错误
        // ================================================================

        function handleFallbackError(img) {
            hideStatusTip();
            showErrorTip('❌ 备用图加载失败，请参考文字描述');
            showTextFallback();
        }

        // ================================================================
        //  主图加载失败 → 右上角 Toast（黄色进度条）+ 切换备用图
        // ================================================================

        function handleImageError(img) {
            if (img.dataset.fallbackAttempted === 'true') {
                showErrorTip('❌ 备用图加载失败，请参考文字描述');
                showTextFallback();
                return;
            }

            img.dataset.fallbackAttempted = 'true';

            // 显示 Toast，8秒自动消失
            showToast('🔄', '主图加载失败', '已切换至备用示意图', 8000);

            hideStatusTip();

            var fallback = document.getElementById('fallbackImage');
            if (fallback) {
                img.style.display = 'none';
                fallback.style.display = 'block';

                fallback.onerror = function() {
                    handleFallbackError(this);
                };
            } else {
                showErrorTip('❌ 备用图加载失败，请参考文字描述');
                showTextFallback();
            }
        }

        // ================================================================
        //  主动检测主图加载状态（3秒超时检测）
        // ================================================================

        function checkMainImage() {
            var mainImg = document.getElementById('mainImage');
            if (!mainImg) return;

            if (mainImg.complete) {
                if (mainImg.naturalWidth === 0) {
                    handleImageError(mainImg);
                }
                return;
            }

            var timeoutId = setTimeout(function() {
                if (!mainImg.complete || mainImg.naturalWidth === 0) {
                    handleImageError(mainImg);
                }
            }, 3000);

            mainImg.onload = function() {
                clearTimeout(timeoutId);
            };
            mainImg.onerror = function() {
                clearTimeout(timeoutId);
                if (!mainImg.dataset.fallbackAttempted) {
                    handleImageError(mainImg);
                }
            };
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkMainImage();
        });
    </script>

</body>
</html>
